version: '3.8'

services:
  # MyProxy Gateway Service
  myproxy-gateway:
    build: .
    container_name: myproxy-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8888:8888"
    networks:
      myproxy-network:
        ipv4_address: 172.20.0.10
      client-network:
        ipv4_address: 172.21.0.10
    volumes:
      - myproxy-data:/app/data
      - ./totp_secrets.json:/app/data/totp_secrets.json
    environment:
      - MYPROXY_DATABASE_URL=sqlite+aiosqlite:////app/data/myproxy.db
      - MYPROXY_DEBUG=false
      - MYPROXY_WEB_HOST=0.0.0.0
      - MYPROXY_WEB_PORT=8080
      - MYPROXY_AUTO_RECOVERY=true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1

  # Simulated Client Device 1 (Mobile)
  client-mobile:
    image: curlimages/curl:latest
    container_name: client-mobile
    networks:
      client-network:
        ipv4_address: 172.21.0.20
    dns:
      - 172.21.0.10  # Use MyProxy as DNS server
    command: |
      sh -c "
        echo '📱 Mobile Client Started - Configuring routing through MyProxy'
        
        # Set MyProxy as default gateway
        ip route del default 2>/dev/null || true
        ip route add default via 172.21.0.10
        echo 'Default route set to MyProxy gateway: 172.21.0.10'
        
        # Show routing table
        echo 'Current routing table:'
        ip route show
        
        while true; do
          echo '=== Testing YouTube Access (should be blocked initially) ==='
          if curl -s --connect-timeout 10 -o /dev/null -w 'YouTube Status: %{http_code}, Time: %{time_total}s\n' https://www.youtube.com 2>/dev/null; then
            echo '✅ YouTube accessible - traffic allowed by MyProxy'
          else
            echo '❌ YouTube blocked - traffic intercepted by MyProxy'
          fi
          
          echo '=== Testing MyProxy Web Interface ==='
          curl -s -o /dev/null -w 'MyProxy Web Status: %{http_code}, Time: %{time_total}s\n' http://172.21.0.10:8080/ 2>/dev/null || echo 'MyProxy web interface unreachable'
          echo '---'
          sleep 60
        done
      "
    cap_add:
      - NET_ADMIN
    privileged: true
    # depends_on:
    #   myproxy-gateway:
    #     condition: service_healthy

  # Simulated Client Device 2 (Laptop)  
  client-laptop:
    image: curlimages/curl:latest
    container_name: client-laptop
    networks:
      - client-network
    command: |
      sh -c "
        echo 'Laptop Client Started'
        while true; do
          echo '💻 Laptop client testing connection...'
          curl -s -o /dev/null -w 'Status: %{http_code}, Time: %{time_total}s\n' http://myproxy-gateway:8080/ || echo 'Connection failed'
          sleep 45
        done
      "
    # depends_on:
    #   myproxy-gateway:
    #     condition: service_healthy

  # Network Monitor (for debugging)
  network-monitor:
    image: nicolaka/netshoot:latest
    container_name: network-monitor
    networks:
      - myproxy-network
      - client-network
    command: |
      sh -c "
        echo 'Network Monitor Started'
        echo 'Available tools: ping, curl, nmap, tcpdump, iperf3'
        echo 'Gateway IP: myproxy-gateway'
        echo 'Use: docker exec -it network-monitor /bin/bash'
        tail -f /dev/null
      "
    tty: true
    stdin_open: true

networks:
  myproxy-network:
    driver: bridge
    name: myproxy-network
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

  client-network:
    driver: bridge
    name: client-network
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.10  # Use MyProxy as the gateway

volumes:
  myproxy-data:
    name: myproxy-data