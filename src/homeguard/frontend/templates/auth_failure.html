<!DOCTYPE html>
<html lang="en">
<head>
    <title>Authentication Failed - HomeguardGuard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #eb3949 0%, #f45c43 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .failure-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
            text-align: center;
            padding: 50px 30px;
        }

        .error-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #eb3949 0%, #f45c43 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: shake 0.5s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .error-icon {
            width: 50px;
            height: 50px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 18px;
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .retry-btn {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #eb3949 0%, #f45c43 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(235, 57, 73, 0.3);
        }

        .retry-btn:active {
            transform: translateY(0);
        }

        .countdown-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }

        .countdown-label {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 10px;
        }

        .countdown-timer {
            font-size: 48px;
            font-weight: 700;
            color: #eb3949;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e1e8ed;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #eb3949 0%, #f45c43 100%);
            border-radius: 3px;
            transition: width 1s linear;
        }

        .info-text {
            font-size: 14px;
            color: #6c757d;
            margin-top: 20px;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .failure-container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .countdown-timer {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="failure-container">
        <div class="error-circle">
            <svg class="error-icon" viewBox="0 0 52 52">
                <line x1="16" y1="16" x2="36" y2="36"/>
                <line x1="36" y1="16" x2="16" y2="36"/>
            </svg>
        </div>

        <h1>Authentication Failed</h1>

        <p class="error-message">
            {{ error_message|default("Invalid authentication code. Please try again.") }}
        </p>

        <a href="/portal" class="retry-btn">Try Again</a>

        <div class="countdown-container">
            <div class="countdown-label">Auto-retry in</div>
            <div class="countdown-timer" id="countdown">5</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="info-text">
            Need help? Contact your network administrator
        </div>
    </div>

    <script>
        let countdown = 5;
        const countdownElement = document.getElementById('countdown');
        const progressBar = document.getElementById('progressBar');

        // Set initial progress
        progressBar.style.width = '100%';

        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            progressBar.style.width = (countdown / 5 * 100) + '%';

            if (countdown <= 0) {
                clearInterval(timer);
                // Redirect back to portal
                window.location.href = '/portal';
            }
        }, 1000);
    </script>
</body>
</html>
