<!DOCTYPE html>
<html lang="en">
<head>
    <title>Authentication Successful - HomeguardGuard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
            text-align: center;
            padding: 50px 30px;
        }

        .checkmark-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .checkmark {
            width: 50px;
            height: 50px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .checkmark-path {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 0.8s ease-out 0.2s forwards;
        }

        @keyframes drawCheck {
            to {
                stroke-dashoffset: 0;
            }
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .success-message {
            font-size: 18px;
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .duration-badge {
            display: inline-block;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .countdown-container {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .countdown-label {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 10px;
        }

        .countdown-timer {
            font-size: 48px;
            font-weight: 700;
            color: #11998e;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e1e8ed;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border-radius: 3px;
            transition: width 1s linear;
        }

        .info-text {
            font-size: 14px;
            color: #6c757d;
            margin-top: 20px;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .success-container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .countdown-timer {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="checkmark-circle">
            <svg class="checkmark" viewBox="0 0 52 52">
                <path class="checkmark-path" d="M14 27l7.5 7.5L38 18"/>
            </svg>
        </div>

        <h1>Authentication Successful!</h1>

        <p class="success-message">
            You now have internet access<br>
            You can close this page
        </p>

        <div class="duration-badge">
            {{ duration_display }}
        </div>

        <div class="countdown-container">
            <div class="countdown-label">Redirecting in</div>
            <div class="countdown-timer" id="countdown">3</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="info-text">
            Your device ({{ client_ip }}) has been granted access
            {% if expires_at %}
            <br>Access expires: {{ expires_at }}
            {% endif %}
        </div>
    </div>

    <script>
        let countdown = 3;
        const countdownElement = document.getElementById('countdown');
        const progressBar = document.getElementById('progressBar');

        // Set initial progress
        progressBar.style.width = '100%';

        const timer = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            progressBar.style.width = (countdown / 3 * 100) + '%';

            if (countdown <= 0) {
                clearInterval(timer);
                // Redirect to a generic success page or close
                window.location.href = '/';
            }
        }, 1000);
    </script>
</body>
</html>
