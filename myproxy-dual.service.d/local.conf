[Service]
# Override for local testing mode
Environment="MYPROXY_MODE=local"
Environment="WAN_INTERFACE=eth0"
Environment="LAN_INTERFACE=lo"  
Environment="MYPROXY_GATEWAY_IP=127.0.0.1"

# Skip mode detection for local testing
ExecStartPre=
ExecStartPre=/bin/bash -c 'echo "MYPROXY_MODE=local" > /etc/myproxy/mode.conf'
ExecStartPre=/bin/bash -c 'echo "WAN_INTERFACE=eth0" >> /etc/myproxy/mode.conf'
ExecStartPre=/bin/bash -c 'echo "LAN_INTERFACE=lo" >> /etc/myproxy/mode.conf'
ExecStartPre=/bin/bash -c 'echo "MYPROXY_GATEWAY_IP=127.0.0.1" >> /etc/myproxy/mode.conf'