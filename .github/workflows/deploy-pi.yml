name: Deploy MyProxy to Raspberry Pi

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH key
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.PI_SSH_KEY }}
    
    - name: Test SSH connection
      run: |
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 raspberrypi@192.168.4.100 'echo "SSH connection successful"'
    
    - name: Deploy to Raspberry Pi
      run: |
        # Copy project files to Pi
        rsync -avz --delete \
          -e "ssh -o StrictHostKeyChecking=no" \
          --exclude '.git' \
          --exclude '.github' \
          --exclude '__pycache__' \
          --exclude '*.pyc' \
          --exclude 'venv' \
          --exclude '.env' \
          --include 'totp_secrets.json' \
          ./ raspberrypi@192.168.4.100:myProxy/
        
        # Run deployment script on Pi
        ssh -o StrictHostKeyChecking=no raspberrypi@192.168.4.100 'cd myProxy && chmod +x scripts/deploy.sh && ./scripts/deploy.sh'
    
    - name: Health check
      run: |
        # Wait for service to start
        sleep 30
        
        # Check service status
        ssh -o StrictHostKeyChecking=no raspberrypi@192.168.4.100 'sudo systemctl is-active myproxy-dual'
        
        # Check if admin interface is responding
        ssh -o StrictHostKeyChecking=no raspberrypi@192.168.4.100 'curl -f http://localhost:8080/health || curl -f http://localhost:8080'
    
    - name: Notify deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ MyProxy successfully deployed to Raspberry Pi"
          echo "🌐 Admin interface: http://192.168.4.100:8080"
        else
          echo "❌ Deployment failed - check logs"
        fi